<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <header>
        <img src="./img/bookhome_icon.png" alt="logo BookHome">
        <span id="dev-icon">
            <div class="telaUpagem" id="telaUpagem">
                <h1>Adicione seu Livro</h1>
                <label for="titulo">Título</label>
                <input type="text" name="titulo" id="tituloUpado" placeholder="Escreva aqui.">
                <label for="autor">Autor</label>
                <input type="text" name="autor" id="autorUpado" placeholder="Escreva aqui.">
                <label for="categoria">Categoria</label>
                <input type="text" name="categoria" id="categoriaUpada" placeholder="Escreva aqui.">
                <label for="capa">Capa do Livro</label>
                <input type="url" name="capa" id="capaUpada" placeholder="URL da Imagem">
                <button onclick="addLivro(capaUpada, tituloUpado, autorUpado, categoriaUpada)">Confirmar</button>
            </div>
        </span>

    </header>

    <section id="principal">
        <img src="/img/bookhome_icon.png" alt="logo BookHome">
        <p>Compre livros físicos de forma <span>Eficiente</span> e <span>Segura</span>.</p>
    </section>

    <section id="livros">
        <h1>Catálogo de Livros</h1>
        <label for="pesquisa">Pesquisa</label>
        <input type="search" name="pesquisa" id="pesquisa" placeholder="Digite o título aqui.">
        <section id="catalogo">
            <div class="cards">
            </div>
        </section>
    </section>
    <script src="script.js"></script>
</body>

</html>
