<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        padding: 0;
        margin: 0;
    }

    #tela-carrinho {
        display: flex;
        flex-direction: column;
        position: absolute;
        top: 100%;
        height: 500px;
        width: 300px;
        background-color: #d9d9d9;
        border: 5px solid #000000;
        border-radius: 25px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        padding: 15px;
        /* display: none; */
        z-index: 1000;
        cursor: auto;
    }

    #carrinho-livros {
        display: flex;
        flex-direction: column;
        background-color: whitesmoke;
        border-radius: 25px;
        height: 460px;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 10px;
        box-sizing: border-box;
    }

    .card-carrinho {
        display: grid;
        grid-template-areas:
            "imagem titulo preco"
            "imagem autor preco";
        grid-template-columns: 80px 1fr auto;
        grid-template-rows: auto auto;
        gap: 5px;
        width: 100%;
        height: auto;
        padding: 15px;
        font-weight: bolder;
        align-items: center;
        box-sizing: border-box;
    }

    .card-carrinho .imagem {
        grid-area: imagem;
        width: 60px;
        height: 60px;
        background-size: cover;
        background-position: center;
        border-radius: 5px;
    }

    .card-carrinho .titulo {
        grid-area: titulo;
        font-size: 16px;
        font-weight: bold;
    }

    .card-carrinho .autor {
        grid-area: autor;
        font-size: 14px;
        color: #555;
    }

    .card-carrinho .preco {
        grid-area: preco;
        font-size: 16px;
        text-align: right;
        font-weight: bold;
    }

    .card-barra {
        width: 80%;
        height: 5px;

        background-color: #b4b4b4;
    }






    #shop-icon {
        background-image: url('./img/shopping-cart.png');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        width: 65px;
        height: 65px;
        margin-right: 100px;
        cursor: pointer;
        position: relative;
        display: inline-block;
    }
</style>

<body>
    <div id="shop-icon">
        <div id="tela-carrinho">
            <h2>Meu Carrinho</h2>
            <div id="carrinho-livros">

            </div>

        </div>

        <script>
            const carrinho = [
                {
                    id: 1,
                    capa: '/img/pequenoprincipe.jpg',
                    titulo: 'O Pequeno Príncipe',
                    autor: 'Antoine de Saint-Exupéry',
                    categoria: 'Literatura Infantil',
                    preco: '$59.90'
                },
                {
                    id: 2,
                    capa: '',
                    titulo: '1984',
                    autor: 'George Orwell',
                    categoria: 'Ficção Distópica',
                    preco: '$39.90'
                }
            ]

            const c = document.getElementById('carrinho-livros');
            c.innerHTML = "";
            carrinho.forEach(cLivro => {
                c.innerHTML += `
                <div class="card-carrinho">
                    <div class="imagem" style="background-image: url('${cLivro.capa || './img/default.jpg'}');"></div>
                    <p class="titulo">${cLivro.titulo}</p>
                    <p class="autor">${cLivro.autor}</p>
                    <p class="preco">${cLivro.preco}</p>
                </div>
                <div class="card-barra"></div>
                `;
            });
        </script>
</body>

</html>
