<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    * {
        padding: 0;
        margin: 0;
    }

    .card-carrinho {
        width: 100%;
        height: 150px;
    }


    .card-carrinho img {
        height: 150px;
        max-width: 150px;
        object-fit: contain;
    }

    #tela-carrinho {
        position: absolute;
        top: 100%;
        height: 500px;
        width: 300px;
        background-color: #d9d9d9;
        border: 5px solid #000000;
        border-radius: 25px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        padding: 15px;
        /* display: none; */
        z-index: 1000;
        cursor: auto;
    }

    #carrinho-livros {
        background-color: whitesmoke;
        border-radius: 25px;
        height: 150px;


    }

    #shop-icon {
        background-image: url('./img/shopping-cart.png');
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        width: 65px;
        height: 65px;
        margin-right: 100px;
        cursor: pointer;
        position: relative;
        display: inline-block;
    }
</style>

<body>
    <div id="shop-icon">
        <div id="tela-carrinho">
            <h2>Meu Carrinho</h2>
            <div id="carrinho-livros">

            </div>

        </div>

        <script>
            const carrinho = [
                {
                    id: 1,
                    capa: '/img/pequenoprincipe.jpg',
                    titulo: 'O Pequeno Príncipe',
                    autor: 'Antoine de Saint-Exupéry',
                    categoria: 'Literatura Infantil'
                }
            ]

            const c = document.getElementById('carrinho-livros');
            c.innerHTML = "";
            carrinho.forEach(cLivro => {
                c.innerHTML += `
                <div class="card-carrinho">
                    <p class="titulo">${cLivro.titulo}</p>
                    <p class="autor">${cLivro.autor}</p>
                    <p class="categoria">${cLivro.categoria}</p>
                </div>
                `
            })
                ;
        </script>
</body>

</html>
